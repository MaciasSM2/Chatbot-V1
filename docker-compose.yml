version: '3.8'

networks:
  prochat_mesh:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

services:
  mariadb-server:
    image: mariadb:10.11
    container_name: prochat_mariadb
    restart: always
    networks:
      - prochat_mesh
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-server:
    image: redis:7.2-alpine
    container_name: prochat_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - prochat_mesh
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  whatsapp-backend:
    build:
      context: .
      dockerfile: whatsapp-backend/Dockerfile
    container_name: prochat_backend
    restart: always
    ports:
      - "3014:3014"
    networks:
      - prochat_mesh
    environment:
      - NODE_ENV=production
      - PORT=3014
      - DB_HOST=mariadb-server
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis-server
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - QDRANT_HOST=qdrant-server
      - QDRANT_PORT=6333
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3014/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mariadb-server:
        condition: service_healthy
      redis-server:
        condition: service_healthy
      qdrant-server:
        condition: service_healthy

  whatsapp-dashboard:
    build:
      context: .
      dockerfile: whatsapp-dashboard/Dockerfile
    container_name: prochat_dashboard
    restart: always
    ports:
      - "3015:3015"
    networks:
      - prochat_mesh
    environment:
      - NODE_ENV=production
      - PORT=3015
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SOCKET_URL=/
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      - whatsapp-backend

  nginx-gateway:
    image: nginx:alpine
    container_name: prochat_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - prochat_mesh
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - whatsapp-dashboard

  qdrant-server:
    image: qdrant/qdrant:latest
    container_name: prochat_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - prochat_mesh
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
