apiVersion: apps/v1
kind: Deployment
metadata:
  name: prochat-dashboard
  labels:
    app: prochat-dashboard
spec:
  replicas: {{ .Values.global.replicaCount.dashboard }}
  selector:
    matchLabels:
      app: prochat-dashboard
  template:
    metadata:
      labels:
        app: prochat-dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.dashboard.service.port }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: {{ .Values.global.environment | quote }}
            - name: PORT
              value: {{ .Values.dashboard.service.port | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: "/api"
            - name: NEXT_PUBLIC_SOCKET_URL
              value: "/"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: prochat-dashboard
  labels:
    app: prochat-dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: {{ .Values.dashboard.service.port }}
      protocol: TCP
  selector:
    app: prochat-dashboard
