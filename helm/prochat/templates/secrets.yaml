apiVersion: v1
kind: Secret
metadata:
  name: prochat-secret
  labels:
    app.kubernetes.io/name: prochat
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  MASTER_ENCRYPTION_KEY: {{ .Values.secrets.masterEncryptionKey | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
