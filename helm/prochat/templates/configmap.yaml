apiVersion: v1
kind: ConfigMap
metadata:
  name: prochat-configmap
  labels:
    app.kubernetes.io/name: prochat
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  PORT: {{ .Values.backend.service.port | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  WA_VERIFY_TOKEN: {{ .Values.config.waVerifyToken | quote }}
