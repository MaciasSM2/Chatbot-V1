name: ProChat Full-Stack Monorepo CI/CD Pipeline (2026)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository into virtual environment
        uses: actions/checkout@v4

      - name: Setup Node.js v20 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install monorepo workspace dependencies
        run: npm ci

      - name: Verify backend TypeScript compilation (strict)
        run: |
          cd whatsapp-backend
          npm run build

      - name: Execute automated unit test suite (Jest)
        run: |
          cd whatsapp-backend
          npm test -- --coverage

      - name: Verify standalone Dashboard build (Next.js)
        run: |
          cd whatsapp-dashboard
          npm run build

  build-and-push-images:
    needs: audit-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download verified code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx environment
        uses: docker/setup-buildx-action@v3

      - name: Build hardened backend Docker artifact
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-backend
          file: ./whatsapp-backend/Dockerfile
          push: false
          tags: prochat-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard UI Docker artifact (NextStandalone)
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-dashboard
          file: ./whatsapp-dashboard/Dockerfile
          push: false
          tags: prochat-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
